# ruff configuration for Common Use AI.
#
# The standard is 120 characters everywhere we write the code. The one
# exception is layers/clean/sensei_clean, which is adapted from an existing
# codebase: reformatting vendored code creates diff noise on every upstream
# change and makes a real bug hard to spot. E501 is ignored there and enforced
# everywhere else.

line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", ".venv", "venv"]

[lint]
select = ["E", "F", "W"]
ignore = [
    "E203",  # slice spacing - conflicts with black
]

[lint.per-file-ignores]
# vendored/adapted third-party layer - see note above
"layers/clean/sensei_clean/**" = ["E501"]
